[package]
name = "rayslash-module-timers"
version = "1.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/rslauncher/rayslash-module-timers"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }

[package.metadata.component]
package = "rayslash:timers"

[package.metadata.component.target]
path = "wit"
world = "module"
